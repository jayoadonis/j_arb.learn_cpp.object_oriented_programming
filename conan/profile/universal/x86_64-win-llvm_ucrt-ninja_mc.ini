#REM: x86_64-win-llvm_ucrt-ninja_mc.ini
#
#REM: Windows x86_64 --- (Clang + libc++ + UCRT). One profile, two hosts:
#REM:   Native Windows x86_64 ---> MSYS2 CLANG64   ($CLANG64_ROOT,   default C:/msys64/clang64)
#REM:   Linux / macOS (cross) ---> llvm-mingw      ($LLVM_MINGW_ROOT, default /opt/llvm-mingw)

{% set _host_os   = detect_api.detect_os() %}
{% set _host_arch = detect_api.detect_arch() %}
{% set _is_native = (_host_os == "Windows" and _host_arch == "x86_64") %}
{% set _triple    = "x86_64-w64-windows-gnu" %}
{% set _generator = "Ninja Multi-Config" %}

#REM: Toolchain root directory
{% if _is_native %}
  {% set _root = os.getenv("CLANG64_ROOT", "C:/msys64/clang64") %}
  {% if not os.path.exists(_root) %}
    {{ None["Native build requires MSYS2 CLANG64 at " ~ _root ~ " (set CLANG64_ROOT)"] }}
  {% endif %}
{% else %}
  {% set _root = os.getenv("LLVM_MINGW_ROOT", "/opt/llvm-mingw") %}
  {% if not os.path.exists(_root) %}
    {{ None["Cross build requires llvm-mingw at " ~ _root ~ " (set LLVM_MINGW_ROOT; not Debian's gcc-mingw-w64)"] }}
  {% endif %}
{% endif %}

{% set _exe = ".exe" if _host_os == "Windows" else "" %}
#REM: Use target-prefixed wrappers when cross-compiling so 
#REM: Autotools/Meson/sub-builds keep the MinGW target
{% set _prefix = "" if _is_native else "x86_64-w64-mingw32-" %}

{% set _compiler_executables = {
    "c":   _root ~ "/bin/" ~ _prefix ~ "clang"   ~ _exe,
    "cpp": _root ~ "/bin/" ~ _prefix ~ "clang++" ~ _exe,
    "rc":  _root ~ "/bin/llvm-rc" ~ _exe,
} %}

{% set _target_flag   = "--target=" ~ _triple %}
{% set _compile_flags = [_target_flag] %}
{% set _link_flags    = [_target_flag, "-fuse-ld=lld"] %}

[settings]
os=Windows
arch=x86_64
compiler=clang
compiler.version=19
compiler.cppstd=17
compiler.libcxx=libc++
build_type=Release

[conf]
tools.cmake.cmaketoolchain:generator={{ _generator }}
tools.cmake.cmake_layout:build_folder=out/build
tools.cmake.cmake_layout:build_folder_vars=["settings.arch", "settings.os", "const.llvm_ucrt", "const.ninja_mc"]
tools.build:compiler_executables={{ _compiler_executables | tojson }}
tools.build:cflags={{ _compile_flags | tojson }}
tools.build:cxxflags={{ _compile_flags | tojson }}
tools.build:sharedlinkflags={{ _link_flags | tojson }}
tools.build:exelinkflags={{ _link_flags | tojson }}
{% if not _is_native %}
tools.build.cross_building:cross_build=true
tools.build.cross_building:can_run=false
{% endif %}

{% if _is_native %}
[buildenv]
#REM: Ensure libc++.dll and libunwind.dll are 
#REM: found if executing native build tools
PATH+=(path){{ _root }}/bin
{% endif %}