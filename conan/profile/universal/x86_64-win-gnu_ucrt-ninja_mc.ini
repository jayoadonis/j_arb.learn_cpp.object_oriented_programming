#REM: x86_64-win-gnu_ucrt-ninja_mc.ini
#
#REM: Windows x86_64 — GCC + libstdc++11 + UCRT (MinGW-w64).
#
#REM: Works on:
#REM:   * Native Windows x86_64  ->  MSYS2 UCRT64    ($UCRT64_ROOT,       default: C:/msys64/ucrt64)
#REM:   * Linux / macOS (cross)  ->  MinGW-w64 UCRT  ($MINGW_PREFIX_ROOT, default: /usr)
#
#REM: Note: Ensure your cross MinGW-w64 toolchain is built with UCRT as default
#REM: (e.g., macOS Homebrew mingw-w64, Ubuntu 24.10+, or custom UCRT sysroot).

{% set _host_os   = detect_api.detect_os() %}
{% set _host_arch = detect_api.detect_arch() %}
{% set _is_native = (_host_os == "Windows" and _host_arch == "x86_64") %}
{% set _generator = "Ninja Multi-Config" %}
#{% set _generator_norm = _generator | trim | lower | replace(" ", "_") | replace("-", "_") %}

#REM: Toolchain root directory
{% if _is_native %}
  {% set _root = os.getenv("UCRT64_ROOT", "C:/msys64/ucrt64") %}
{% else %}
  {% set _root = os.getenv("MINGW_PREFIX_ROOT", "/usr") %}
{% endif %}

{% set _exe    = ".exe" if _host_os == "Windows" else "" %}
{% set _prefix = "x86_64-w64-mingw32-" %}

#REM: Resolve compilers to absolute paths (PATH-independent)
{% set _c   = _root ~ "/bin/" ~ _prefix ~ "gcc"     ~ _exe %}
{% set _cpp = _root ~ "/bin/" ~ _prefix ~ "g++"     ~ _exe %}
{% set _rc  = _root ~ "/bin/" ~ _prefix ~ "windres" ~ _exe %}

{% if not os.path.exists(_c) %}
  {{ None["GCC not found at " ~ _c
          ~ " - set UCRT64_ROOT (native) or MINGW_PREFIX_ROOT (cross)"] }}
{% endif %}

#REM: Compiler version guard
{% set _gcc_major = os.getenv("GCC_MAJOR", "14") %}

[settings]
os=Windows
arch=x86_64
compiler=gcc
compiler.version={{ _gcc_major }}
compiler.cppstd=17
compiler.libcxx=libstdc++11
compiler.threads=posix
build_type=Release

[conf]
tools.cmake.cmaketoolchain:generator={{ _generator }}
tools.cmake.cmake_layout:build_folder=out/build
tools.cmake.cmake_layout:build_folder_vars=["settings.arch", "settings.os", "const.gnu_ucrt", "const.ninja_mc"]
tools.build:compiler_executables={"c": "{{ _c }}", "cpp": "{{ _cpp }}", "rc": "{{ _rc }}"}
{% if not _is_native %}
tools.build.cross_building:cross_build=true
tools.build.cross_building:can_run=false
{% endif %}

{% if _is_native %}
[buildenv]
#REM: Ensure libstdc++-6.dll, libgcc_s_seh-1.dll, and libwinpthread-1.dll are found
PATH+=(path){{ _root }}/bin
{% endif %}
