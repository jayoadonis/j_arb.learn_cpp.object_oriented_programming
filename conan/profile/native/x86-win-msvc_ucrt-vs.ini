#REM: x86-win-msvc_ucrt-vs.ini
#REM:
#REM: Windows x86 (32-bit) --- MSVC + Microsoft STL + UCRT via 
#REM: Visual Studio 2022 (MSBuild). Works directly from a plain 
#REM: terminal without Developer Command Prompt.

{% set _host_os   = detect_api.detect_os() %}
{% set _host_arch = detect_api.detect_arch() %}
{% set _is_win    = (_host_os == "Windows" and _host_arch in ["x86", "x86_64"]) %}
{% set _generator = "Visual Studio 17 2022" %}

{% if not _is_win %}
  {{ None["MSVC profile requires a Windows host (detected: " ~ _host_os ~ " " ~ _host_arch ~ ")"] }}
{% endif %}

{% set _msvc_ver = os.getenv("MSVC_VERSION", "194") %}

[settings]
os=Windows
arch=x86
compiler=msvc
compiler.version={{ _msvc_ver }}
compiler.cppstd=17
compiler.runtime=dynamic
compiler.runtime_type=Release
build_type=Release

[conf]
tools.cmake.cmaketoolchain:generator={{ _generator }}
tools.cmake.cmake_layout:build_folder=out/build
tools.cmake.cmake_layout:build_folder_vars=["settings.arch", "settings.os", "const.msvc_ucrt", "const.vs"]
{% if _host_arch != "x86" %}
tools.build.cross_building:cross_build=true
tools.build.cross_building:can_run=true
{% endif %}
