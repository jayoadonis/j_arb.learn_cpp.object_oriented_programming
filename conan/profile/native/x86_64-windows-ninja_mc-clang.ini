{% set generator = "Ninja Multi-Config" %}
# {% set generator_normalized = generator | lower | replace(" ", "_") | replace("-", "_") %}
{% set generator_normalized = "ninja_mc" %}
[settings]
os=Windows
arch=x86_64
compiler=clang
compiler.version=22
compiler.cppstd=17
compiler.libcxx=libc++
build_type=Release

[conf]
tools.cmake.cmaketoolchain:generator={{generator}}
tools.cmake.cmake_layout:build_folder=out/build
tools.cmake.cmake_layout:build_folder_vars=["settings.arch", "settings.os", "const.{{generator_normalized}}", "settings.compiler"]
tools.build:compiler_executables={"c": "clang.exe", "cpp": "clang++.exe"}