[settings]
os=Windows
arch=x86_64
compiler=clang
compiler.version=22
compiler.cppstd=17
compiler.libcxx=libc++
build_type=Release

[conf]
tools.cmake.cmaketoolchain:generator=Ninja
tools.cmake.cmake_layout:build_folder=out/build
tools.cmake.cmake_layout:build_folder_vars=["settings.arch", "settings.os", "const.ninja", "settings.compiler"]
# tools.build:compiler_executables={"c": "C:/msys64/clang64/bin/clang.exe", "cpp": "C:/msys64/clang64/bin/clang++.exe"}
tools.build:compiler_executables={"c": "clang.exe", "cpp": "clang++.exe"}