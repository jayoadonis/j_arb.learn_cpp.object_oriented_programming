#REM: x86_64-win-msvc_ucrt-ninja_mc.ini
#REM: 
#REM: Windows x86_64 --- MSVC (cl.exe) + Microsoft STL + UCRT.
#REM: 
#REM: Works on:
#REM:   * Native Windows x86_64 ---> Visual Studio 2022 (193/194) or Build Tools
#REM: 
#REM: Note: Conan's CMakeToolchain automatically locates 
#REM:       vcvarsall.bat via vswhere and configures the 
#REM:       Ninja Multi-Config environment.

{% set _host_os        = detect_api.detect_os() %}
{% set _host_arch      = detect_api.detect_arch() %}
{% set _is_native      = (_host_os == "Windows" and _host_arch == "x86_64") %}
{% set _generator      = "Visual Studio 17 2022" %}
#{% set _generator_norm = _generator | trim | lower | replace(" ", "_") | replace("-", "_") %}

{% if not _is_native %}
  {{ None["MSVC native profile requires a Windows x86_64 host (detected: " ~ _host_os ~ " " ~ _host_arch ~ ")"] }}
{% endif %}

#REM: 194 = VS 2022 17.10+ | 193 = VS 2022 17.0-17.9
{% set _msvc_ver = os.getenv("MSVC_VERSION", "194") %}

[settings]
os=Windows
arch=x86_64
compiler=msvc
compiler.version={{ _msvc_ver }}
compiler.cppstd=17
compiler.runtime=dynamic
compiler.runtime_type=Release
build_type=Release

[conf]
#tools.env.virtualenv:powershell=True
tools.cmake.cmaketoolchain:generator={{ _generator }}
tools.cmake.cmake_layout:build_folder=out/build
tools.cmake.cmake_layout:build_folder_vars=["settings.arch", "settings.os", "const.msvc_ucrt", "const.vs"]